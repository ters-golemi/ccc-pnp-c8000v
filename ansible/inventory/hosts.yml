---
# Ansible Inventory for Cisco Catalyst Center PNP Automation

all:
  children:
    # Cisco Catalyst Center (DNA Center)
    catalyst_center:
      hosts:
        dnac:
          ansible_host: catalyst-center.example.com
          ansible_user: admin
          ansible_password: C1sco12345
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
      
      vars:
        # Catalyst Center API settings
        dnac_host: catalyst-center.example.com
        dnac_username: admin
        dnac_password: C1sco12345
        dnac_verify: false
        dnac_version: "3.1.0"
        dnac_debug: false
    
    # PNP Devices to be onboarded
    pnp_devices:
      hosts:
        v8000-2:
          # Device identification
          serial_number: FCH1234ABCD
          hostname: v8000-2
          device_type: "Cisco Catalyst 8000V"
          platform: C8000V
          
          # Site assignment
          site: Global/US/San_Jose/Floor1
          
          # Network configuration
          wan_interface:
            name: GigabitEthernet1
            ip: 192.168.1.10
            mask: 255.255.255.0
            gateway: 192.168.1.1
          
          lan_interface:
            name: GigabitEthernet2
            ip: 10.0.0.1
            mask: 255.255.255.0
          
          # Template configuration
          template_name: C8000V-Day0-Template
          template_project: Onboarding Configuration
      
      vars:
        # Common variables for all PNP devices
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
